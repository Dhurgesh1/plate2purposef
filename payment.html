<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plate2Purpose - Access</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Nunito',sans-serif;
}

body{
background:linear-gradient(135deg,#ffdab9,#ffb6a0,#ffdab9);
min-height:100vh;
overflow-x:hidden;
padding:40px 20px;
}

/* Floating background */

.bg{
position:fixed;
inset:0;
overflow:hidden;
z-index:0;
}

.circle{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,.15);
animation:float 10s infinite ease-in-out;
}

.circle:nth-child(1){
width:120px;
height:120px;
top:10%;
left:10%;
}

.circle:nth-child(2){
width:180px;
height:180px;
top:60%;
right:10%;
animation-delay:2s;
}

.circle:nth-child(3){
width:90px;
height:90px;
top:30%;
right:25%;
animation-delay:4s;
}

@keyframes float{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-30px);
}
}

.container{
max-width:900px;
margin:auto;
position:relative;
z-index:10;
}

.card{
background:rgba(255,255,255,.9);
backdrop-filter:blur(20px);
border-radius:30px;
padding:50px;
box-shadow:0 20px 60px rgba(0,0,0,.1);
}

.logo{
width:320px;
max-width:100%;
display:block;
margin:auto;
margin-bottom:30px;
}

h1{
text-align:center;
font-size:3rem;
color:#a94442;
margin-bottom:15px;
}

.subtitle{
text-align:center;
font-size:1.2rem;
color:#555;
margin-bottom:40px;
}

.info{
background:#fff5f0;
padding:20px;
border-radius:15px;
margin-bottom:25px;
}

.info p{
margin:10px 0;
word-break:break-word;
}

.notice{
background:#fff8e1;
border-left:5px solid #ffc107;
padding:20px;
border-radius:10px;
margin-bottom:30px;
}

.button{
width:100%;
border:none;
padding:18px;
font-size:18px;
font-weight:700;
border-radius:15px;
background:#cb7575;
color:white;
cursor:pointer;
transition:.3s;
}

.button:hover{
transform:translateY(-2px);
background:#b45f5f;
}

.button:disabled{
opacity:.7;
cursor:not-allowed;
}

.loader{
display:none;
width:20px;
height:20px;
border:3px solid rgba(255,255,255,.4);
border-top:3px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
margin:auto;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.success{
display:none;
text-align:center;
padding:30px;
}

.success h2{
color:#28a745;
margin-bottom:15px;
}
</style>
</head>
<body>

<div class="bg">
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
</div>

<div class="container">

<div class="card">

<img src="images/plate2purposename.png" class="logo">

<h1>Premium Access</h1>

<p class="subtitle">
Payment portal is currently under development.
</p>

<div class="info">
<p><strong>Name:</strong> <span id="name">Loading...</span></p>
<p><strong>Email:</strong> <span id="email">Loading...</span></p>
<p><strong>User ID:</strong> <span id="userid">Loading...</span></p>
</div>

<div class="notice">
 For now, Plate2Purpose is completely free while Stripe integration is being built.
<br><br>
Click the button below to unlock full access.
</div>

<button id="activateBtn" class="button">
Use For Free (Temporary)
</button>

<div class="success" id="success">
<h2> Access Activated</h2>
<p>Redirecting to dashboard...</p>
</div>

</div>

</div>

<script>
const client = supabase.createClient(
"https://pljmachiuahkrkiddehc.supabase.co",
"YOUR_ANON_KEY"
);

let currentUser=null;

async function loadUser(){

const {data:{user}}=await client.auth.getUser();

if(!user){
location.href="login.html";
return;
}

currentUser=user;

document.getElementById("name").textContent=
user.user_metadata?.full_name || "User";

document.getElementById("email").textContent=
user.email;

document.getElementById("userid").textContent=
user.id;
}

loadUser();

document.getElementById("activateBtn")
.addEventListener("click",async()=>{

const btn=document.getElementById("activateBtn");

btn.disabled=true;
btn.innerHTML='<div class="loader" style="display:block"></div>';

const {error}=await client
.from("subscriptions")
.update({
purchased:true
})
.eq("user_id",currentUser.id);

if(error){
alert(error.message);
btn.disabled=false;
btn.innerHTML="Use For Free (Temporary)";
return;
}

document.getElementById("success").style.display="block";

setTimeout(()=>{
location.href="dashboard.html";
},2000);

});
</script>

</body>
</html>
